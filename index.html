<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summo</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>Summo</h1>
  <p>Es susu murni berbagai varian rasa</p>
</header>

<section class="products">

  <div class="card">
    <img src="./assets/product/product1.jpg" alt="">
    <h3>Rasa Coklat</h3>
    <span class="price">2500</span>
    <button onclick="addToCart('Rasa Coklat', 2500)">Tambah</button>
  </div>

  <div class="card">
    <img src="./assets/product/product2.jpg" alt="">
    <h3>Rasa Matcha</h3>
    <span class="price">2500</span>
    <button onclick="addToCart('Rasa Matcha', 2500)">Tambah</button>
  </div>

  <div class="card">
    <img src="./assets/product/product3.jpg" alt="">
    <h3>Rasa Keju</h3>
    <span class="price">2500</span>
    <button onclick="addToCart('Rasa Keju', 2500)">Tambah</button>
  </div>

  <div class="card">
    <img src="./assets/product/product4.jpg" alt="">
    <h3>Rasa cappucino</h3>
    <span class="price">2500</span>
    <button onclick="addToCart('Rasa cappucino', 2500)">Tambah</button>
  </div>

  <div class="card">
    <img src="./assets/product/product5.jpg" alt="">
    <h3>Rasa Taro</h3>
    <span class="price">2500</span>
    <button onclick="addToCart('Rasa Taro', 2500)">Tambah</button>
  </div>

  <div class="card">
    <img src="./assets/product/product6.jpg" alt="">
    <h3>Rasa Tiramisu</h3>
    <span class="price">2500</span>
    <button onclick="addToCart('Rasa Tiramisu', 2500)">Tambah</button>
  </div>

  <div class="card">
    <img src="./assets/product/product7.jpg" alt="">
    <h3>Rasa strawberry</h3>
    <span class="price">2500</span>
    <button onclick="addToCart('Rasa strawberry', 2500)">Tambah</button>
  </div>

  <div class="card">
    <img src="./assets/product/product8.jpg" alt="">
    <h3>Rasa vanila</h3>
    <span class="price">2500</span>
    <button onclick="addToCart('Rasa vanila', 2500)">Tambah</button>
  </div>

</section>

<!-- Floating Cart Button -->
<div id="cartButton" onclick="toggleCart()">
  🛒 Keranjang <span id="cartCount">0</span>
</div>

<!-- Cart Modal -->
<div id="cartModal">
  <h2>Keranjang Belanja</h2>
  <ul id="cartItems"></ul>
  <p style="text-align:center;font-weight:600;font-size:15px;margin-top:4px;">
    Total: Rp <span id="totalPrice">0</span>
  </p>




<!-- Input Nama -->
<div class="input-group">
    <label>Nama Pembeli:</label>
    <input type="text" id="buyerName" placeholder="Masukkan nama Anda">
  </div>
  
  <!-- Metode Pembayaran -->
  <div class="input-group">
    <label>Metode Pembayaran:</label>
    <select id="paymentMethod">
        <option value="">-- Pilih metode pembayaran --</option>
        <option value="CASH">CASH</option>
        <option value="TRANSFER BANK">TRANSFER BANK</option>
        <option value="QRIS">QRIS</option>
        <option value="DANA">DANA</option>
        <option value="OVO">OVO</option>
        <option value="GOPAY">GOPAY</option>
        <option value="SHOPEE PAY">SHOPEE PAY</option>
    </select>
  </div>



  <label class="label-note">Catatan Pembeli (opsional)</label>
  <textarea id="buyerNote" placeholder="Contoh: isi nama kelas/alamat"></textarea>




  
  <button onclick="checkout()">Checkout</button>
  <button onclick="toggleCart()" style="background:#e63946;margin-top:6px;">Tutup</button>
</div>




<footer class="footer">
    <p>© 2025 Web By Divzz.</p>
  </footer>  





<script src="script.js"></script>
</body>
</html>
