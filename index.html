<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iman Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-blue-100 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Header -->
    <header class="p-6 text-center">
        <div class="flex items-center justify-center gap-2 font-bold text-2xl text-indigo-900">
            <i class="fa-solid fa-asterisk text-indigo-600"></i>
            <span>Iman Store</span>
        </div>
    </header>

    <!-- Main Options -->
    <main class="max-w-4xl mx-auto px-4 py-8 text-center flex-1 flex flex-col justify-center">
        <h1 class="text-3xl md:text-5xl font-extrabold text-indigo-950 mb-3">Iman Store</h1>
        <p class="text-slate-600 mb-10 text-base md:text-lg">Pilih layanan yang ingin Anda akses di bawah ini:</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto w-full">
            <!-- Pilihan 1: Ke Halaman Top Up & Transaksi -->
            <a href="order.html" class="group bg-white p-8 rounded-2xl shadow-lg hover:shadow-2xl transition duration-300 transform hover:-translate-y-2 border border-indigo-100 flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-indigo-100 group-hover:bg-indigo-600 text-indigo-600 group-hover:text-white rounded-2xl flex items-center justify-center text-3xl transition duration-300 mb-4">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">Pesan Pulsa & Top Up</h2>
                <p class="text-slate-500 text-sm">Layanan isi pulsa, paket data, topup e-wallet, game, & bayar tagihan.</p>
                <span class="mt-6 inline-flex items-center text-indigo-600 font-semibold text-sm group-hover:translate-x-1 transition">
                    Buka Service <i class="fa-solid fa-arrow-right ml-2"></i>
                </span>
            </a>

            <!-- Pilihan 2: Ke Halaman Milik Anda -->
            <a href="summo.html" class="group bg-white p-8 rounded-2xl shadow-lg hover:shadow-2xl transition duration-300 transform hover:-translate-y-2 border border-purple-100 flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-purple-100 group-hover:bg-purple-600 text-purple-600 group-hover:text-white rounded-2xl flex items-center justify-center text-3xl transition duration-300 mb-4">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">ES SUSU IMAN</h2>
                <p class="text-slate-500 text-sm">Kik untuk memesan es susu iman yang nikmat.</p>
                <span class="mt-6 inline-flex items-center text-purple-600 font-semibold text-sm group-hover:translate-x-1 transition">
                    Buka Halaman <i class="fa-solid fa-arrow-right ml-2"></i>
                </span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-slate-500 text-sm">
        &copy; 2026 Divzz Dev. All rights reserved.
    </footer>

</body>
</html>
